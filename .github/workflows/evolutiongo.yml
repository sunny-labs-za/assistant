name: Evolution Go

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile.evolutiongo'
      - '.github/workflows/evolutiongo.yml'
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to build and publish'
        required: false
        default: 'latest'
        type: string
      ref:
        description: 'Upstream git ref (release tag or branch); empty = latest release'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      version: ${{ steps.resolve.outputs.version }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve upstream ref
        id: resolve
        env:
          INPUT_REF: ${{ github.event.inputs.ref }}
        run: |
          if [ -n "$INPUT_REF" ]; then
            REF="$INPUT_REF"
          else
            REF=$(curl -sf -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              https://api.github.com/repos/evolution-foundation/evolution-go/releases/latest \
              | jq -r '.tag_name')
            if [ -z "$REF" ] || [ "$REF" = "null" ]; then
              echo "Failed to fetch latest release tag" >&2
              exit 1
            fi
          fi
          # Strip leading v for image version label when present
          VERSION="${REF#v}"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building evolution-go @ $REF (version=$VERSION)"

  docker_image:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sunny-zeroclaw (Dockerfile)
        uses: actions/checkout@v7

      - name: Checkout evolution-go
        uses: actions/checkout@v7
        with:
          repository: evolution-foundation/evolution-go
          ref: ${{ needs.prepare.outputs.ref }}
          path: evolution-go

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/sunny-labs-za/evolution-go
          tags: |
            type=raw,value=${{ github.event.inputs.tag || 'latest' }}
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=https://github.com/evolution-foundation/evolution-go
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./evolution-go
          file: ./Dockerfile.evolutiongo
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
