name: ZeroClaw

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile.zeroclaw'
      - '.github/workflows/zeroclaw.yml'
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to build and publish'
        required: false
        default: 'latest'
        type: string

permissions:
  actions: write
  contents: read
  packages: write

jobs:
  prepare:
    outputs:
      tag: ${{ steps.latest_release.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - name: Get latest release
        id: latest_release
        run: |
          TAG=$(curl -sf -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/zeroclaw-labs/zeroclaw/releases/latest | jq -r '.tag_name')
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "Failed to fetch latest release tag" >&2
            exit 1
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

  web:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          repository: zeroclaw-labs/zeroclaw
          ref: ${{ needs.prepare.outputs.tag }}
          path: zeroclaw

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: zeroclaw/web/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: zeroclaw
          shared-key: web

      - name: Build web dashboard
        working-directory: zeroclaw
        run: cargo web build

      - name: Upload web dashboard
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: zeroclaw/web/dist
          retention-days: 1

  build:
    needs: prepare
    strategy:
      matrix:
        platform:
          - target: x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          repository: zeroclaw-labs/zeroclaw
          ref: ${{ needs.prepare.outputs.tag }}
          path: zeroclaw

      - name: Install cross-linker (ARM64)
        if: matrix.platform.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.platform.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: zeroclaw
          shared-key: build-${{ matrix.platform.target }}

      - name: Build binary
        working-directory: zeroclaw
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          RUSTFLAGS: "-C strip=symbols"
        run: |
          cargo build \
            --release \
            --locked \
            --target ${{ matrix.platform.target }} \
            --features agent-runtime,whatsapp-web,browser-native,plugins-wasm

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: zeroclaw-${{ matrix.platform.target }}
          path: zeroclaw/target/${{ matrix.platform.target }}/release/zeroclaw
          retention-days: 1

  docker_image:
    runs-on: ubuntu-latest
    needs: [prepare, web, build]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: zeroclaw

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/sunny-labs-za/zeroclaw
          tags: |
            type=raw,value=${{ github.event.inputs.tag || 'latest' }}
            type=raw,value=${{ needs.prepare.outputs.tag }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.version=${{ needs.prepare.outputs.tag }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./zeroclaw
          file: ./Dockerfile.zeroclaw
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
